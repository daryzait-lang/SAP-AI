[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-b1-copilot"
version = "0.1.0"
description = "SAP B1 Engineering Copilot - Base limpia y extensible para modernización de soluciones SAP Business One"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
sap-b1-copilot = "sap_b1_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
